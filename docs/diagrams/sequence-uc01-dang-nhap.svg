<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1450" viewBox="0 0 1400 1450">
<style>.title{font:700 22px Arial;fill:#172033}.head{font:700 16px Arial;fill:#172033}.text{font:15px Arial;fill:#172033}.small{font:14px Arial;fill:#172033}.line{stroke:#68788e;stroke-width:1.4;fill:none}.life{stroke:#8794a5;stroke-width:1.2;stroke-dasharray:7 5}.box{fill:#fff;stroke:#25364d;stroke-width:1.5}.alt{fill:none;stroke:#172033;stroke-width:1.5}.act{fill:#dbe9f9;stroke:#4c78a8;stroke-width:1.3}.stick{stroke:#172033;stroke-width:2.2;fill:none}.db{fill:#e8eef6;stroke:#172033;stroke-width:2}.arrow{stroke:#25364d;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dash{stroke:#506784;stroke-width:1.4;stroke-dasharray:6 4;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#25364d"/></marker></defs>
<rect width="1400" height="1450" fill="white"/><text x="700" y="35" text-anchor="middle" class="title">SƠ ĐỒ TUẦN TỰ - ĐĂNG NHẬP, ĐĂNG XUẤT VÀ PHÂN QUYỀN</text>
<!-- headings -->
<g transform="translate(105 100)"><circle cx="0" cy="0" r="12" class="stick"/><path d="M0 12v38M-22 27h44M0 50l-22 28M0 50l22 28" class="stick"/><text x="0" y="104" text-anchor="middle" class="head">Người dùng</text></g>
<g transform="translate(355 100)"><circle cx="0" cy="0" r="12" class="stick"/><path d="M0 12v38M-22 27h44M0 50l-22 28M0 50l22 28" class="stick"/><text x="0" y="104" text-anchor="middle" class="head">Giao diện</text><text x="0" y="124" text-anchor="middle" class="head">Login View</text></g>
<g transform="translate(650 100)"><circle cx="0" cy="0" r="12" class="stick"/><path d="M0 12v38M-22 27h44M0 50l-22 28M0 50l22 28" class="stick"/><text x="0" y="104" text-anchor="middle" class="head">ASP NET Identity</text><text x="0" y="124" text-anchor="middle" class="head">SignInManager</text></g>
<g transform="translate(940 100)"><circle cx="0" cy="0" r="12" class="stick"/><path d="M0 12v38M-22 27h44M0 50l-22 28M0 50l22 28" class="stick"/><text x="0" y="104" text-anchor="middle" class="head">UserManager</text><text x="0" y="124" text-anchor="middle" class="head">Phân quyền</text></g>
<g transform="translate(1235 74)"><ellipse cx="0" cy="0" rx="25" ry="11" class="db"/><path d="M-25 0v62c0 15 50 15 50 0V0M-25 31c0 15 50 15 50 0" class="db"/><text x="0" y="104" text-anchor="middle" class="head">CSDL</text></g>
<!-- lifelines -->
<g class="life"><path d="M105 170V1370M355 170V1370M650 170V1370M940 170V1370M1235 170V1370"/></g>
<!-- login -->
<text x="105" y="205" class="text">Mở trang đăng nhập</text><path d="M125 215H335" class="arrow"/><rect x="640" y="228" width="20" height="90" class="act"/><text x="355" y="260" class="text">Nhập email và mật khẩu</text><path d="M375 270H630" class="arrow"/><text x="650" y="300" class="small">Kiểm tra dữ liệu đầu vào</text>
<text x="650" y="345" class="text">PasswordSignInAsync(email, mật khẩu)</text><path d="M670 355H920" class="arrow"/><rect x="930" y="368" width="20" height="205" class="act"/><text x="940" y="400" class="small">Tìm tài khoản theo email</text><path d="M960 410H1215" class="arrow"/><text x="1010" y="440" class="small">Thông tin tài khoản</text><path d="M1215 450H960" class="dash"/><text x="940" y="480" class="small">Kiểm tra mật khẩu</text><text x="940" y="510" class="small">Lấy vai trò: Admin, Lễ tân, Thợ</text><path d="M920 530H670" class="dash"/><text x="720" y="555" class="small">Kết quả xác thực và vai trò</text>
<!-- alt success/fail -->
<rect x="325" y="590" width="950" height="385" class="alt"/><path d="M325 625H1275" class="line"/><text x="340" y="615" class="head">alt</text><text x="400" y="615" class="small">[Đăng nhập thành công]</text><text x="650" y="660" class="text">Tạo cookie xác thực và cấp quyền theo vai trò</text><path d="M670 670H920" class="arrow"/><text x="940" y="710" class="small">Xác định quyền truy cập chức năng</text><path d="M920 720H670" class="dash"/><text x="650" y="760" class="text">Trả kết quả đăng nhập thành công</text><path d="M630 770H375" class="dash"/><text x="355" y="805" class="text">Điều hướng Dashboard phù hợp vai trò</text><path d="M335 815H125" class="dash"/><text x="105" y="845" class="text">Sử dụng chức năng được cấp quyền</text><path d="M325 870H1275" class="line"/><text x="400" y="895" class="small">[Email hoặc mật khẩu không đúng]</text><text x="650" y="930" class="text">Trả lỗi đăng nhập</text><path d="M630 940H375" class="dash"/><text x="355" y="960" class="text">Hiển thị thông báo: Thông tin đăng nhập không đúng</text>
<!-- authorization -->
<text x="105" y="1025" class="text">Chọn một chức năng cần quyền</text><path d="M125 1035H630" class="arrow"/><text x="650" y="1060" class="text">Kiểm tra vai trò người dùng</text><path d="M670 1070H920" class="arrow"/><rect x="930" y="1080" width="20" height="65" class="act"/><text x="940" y="1110" class="small">Đối chiếu quyền truy cập</text><path d="M920 1140H670" class="dash"/><rect x="325" y="1160" width="650" height="105" class="alt"/><text x="340" y="1185" class="head">alt</text><text x="400" y="1185" class="small">[Có quyền]</text><text x="400" y="1220" class="small">Hiển thị chức năng</text><text x="720" y="1185" class="small">[Không có quyền]</text><text x="720" y="1220" class="small">Từ chối truy cập và thông báo lỗi</text>
<!-- logout -->
<text x="105" y="1300" class="text">Chọn Đăng xuất</text><path d="M125 1310H630" class="arrow"/><text x="650" y="1335" class="text">SignOutAsync, hủy cookie phiên đăng nhập</text><path d="M630 1350H375" class="dash"/><text x="355" y="1375" class="text">Quay về trang Đăng nhập</text><path d="M335 1385H125" class="dash"/>
</svg>
